name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    uses: TobyAnscombe/github-actions/.github/workflows/gitleaks.yml@main
    permissions:
      security-events: write

  powershell-lint:
    uses: TobyAnscombe/github-actions/.github/workflows/powershell-lint.yml@main
    with:
      settings_file: PSScriptAnalyzerSettings.psd1

  claude-file-check:
    uses: TobyAnscombe/github-actions/.github/workflows/claude-file-check.yml@main

  protect-main:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [secret-scan, powershell-lint, claude-file-check]
    uses: TobyAnscombe/github-actions/.github/workflows/branch-protection.yml@main
    secrets:
      token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
    with:
      required_checks: '["secret-scan / Scan for secrets", "powershell-lint / powershell-lint", "claude-file-check / claude-file-check"]'
